<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Get free Steal a Brainrot items instantly! Select your favorite items and unlock them for free.">
    <meta name="theme-color" content="#0f172a">
    <title>Steal a Brainrot - Free Items Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --primary-accent: #00ff9d;
            --primary-hover: #00cc7d;
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-active: rgba(0, 255, 157, 0.5);
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 15px rgba(0, 255, 157, 0.2);
            --transition: 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 41, 59, 1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 1) 0px, transparent 50%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        body.no-scroll { overflow: hidden; }
        img { pointer-events: none; }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 15px 120px;
            animation: fadeIn 0.6s ease;
        }

        /* ===== HEADER SECTION ===== */
        .header { text-align: center; margin-bottom: 25px; }
        
        .header img {
            width: 100px;
            max-width: 100%;
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 15px;
        }

        @media (min-width: 768px) { .header img { width: 120px; } }

        .active-users {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .active-users span {
            color: var(--primary-accent);
            animation: pulse 2s infinite;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 15px 0 8px;
            color: var(--text-main);
            line-height: 1.2;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding: 0 10px;
            line-height: 1.4;
        }

        /* ===== GRID LAYOUT ===== */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        @media (min-width: 480px) { .items-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
        @media (min-width: 768px) { 
            .items-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
            .title { font-size: 1.7rem; }
            .subtitle { font-size: 1rem; }
        }
        @media (min-width: 1024px) { .items-grid { grid-template-columns: repeat(5, 1fr); gap: 20px; } }

        /* ===== ITEM CARDS ===== */
        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-subtle);
        }

        .item-card:active { transform: scale(0.96); }

        @media (hover: hover) {
            .item-card:hover {
                background: var(--bg-card-hover);
                transform: translateY(-2px);
            }
        }

        .item-card.selected {
            border-color: var(--primary-accent);
            background: rgba(0, 255, 157, 0.05);
            box-shadow: var(--shadow-glow);
            transform: scale(1.02);
        }

        .item-img {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
            background: #111827;
            margin-bottom: 12px;
            transition: var(--transition);
        }

        @media (min-width: 768px) { .item-img { width: 75px; height: 75px; } }

        .item-card.selected .item-img { box-shadow: 0 0 12px rgba(0, 255, 157, 0.35); }

        .item-name {
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-muted);
            line-height: 1.3;
            width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            min-height: 2em;
        }

        .item-card.selected .item-name { color: var(--primary-accent); }

        /* ===== BUTTONS & NOTIFICATIONS ===== */
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: shake 0.4s ease;
        }

        .btn-primary {
            background: var(--primary-accent);
            color: #020617;
            border: none;
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 255, 157, 0.3);
            width: 90%;
            max-width: 350px;
        }

        .btn-primary:active { transform: scale(0.96) translateX(-50%); }

        @media (hover: hover) {
            .btn-primary:hover {
                background: var(--primary-hover);
                transform: translateY(-2px) translateX(-50%);
                box-shadow: 0 6px 20px rgba(0, 255, 157, 0.4);
            }
        }

        #continue-btn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            z-index: 100;
            visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        #continue-btn.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        /* ===== MODALS / OVERLAYS (ROTATION FIXED) ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            animation: fadeIn 0.3s ease;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            max-height: 85vh; /* Fallback */
            max-height: 85dvh; /* Adapts properly when rotating to landscape */
            display: flex;
            flex-direction: column;
            padding: 20px 15px 15px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.3s ease;
        }

        .modal-scroll-area {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 5px 10px;
            flex-grow: 1;
            text-align: center;
        }

        /* Custom subtle scrollbar */
        .modal-scroll-area::-webkit-scrollbar { width: 4px; }
        .modal-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
        }

        .close-btn:active { transform: scale(0.9); }

        @media (hover: hover) {
            .close-btn:hover { background: rgba(255, 255, 255, 0.2); color: var(--text-main); }
        }

        /* ===== POPUP SPECIFICS ===== */
        .preview-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preview-img {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            border: 2px solid var(--primary-accent);
            object-fit: cover;
            box-shadow: var(--shadow-glow);
        }

        .input-field {
            width: 100%;
            padding: 16px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 1rem;
            margin: 15px 0;
            outline: none;
            transition: var(--transition);
            -webkit-appearance: none;
        }

        .input-field:focus {
            border-color: var(--primary-accent);
            box-shadow: inset 0 0 0 1px var(--primary-accent);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-secondary, .btn-action {
            padding: 14px;
            border-radius: 10px;
            flex: 1;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        .btn-action { background: var(--text-main); color: #000; border: none; }
        .btn-action:active { transform: scale(0.96); }

        /* ===== UPGRADED LOCKER SPECIFICS ===== */
        .locker-header { text-align: center; margin-bottom: 15px; padding-top: 5px; }
        .locker-header h3 { font-size: 1.25rem; line-height: 1.3; }

        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 157, 0.1);
            color: var(--primary-accent);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 8px;
            border: 1px solid rgba(0, 255, 157, 0.2);
        }

        .locker-preview-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px inset rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .verification-status {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: pulse 2s infinite;
        }

        .offer-instructions {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .offer-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }

        .offer-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: var(--transition);
        }

        .offer-btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.08); }
        .offer-icon {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: #fff;
            padding: 2px;
            flex-shrink: 0;
        }

        .offer-text {
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            flex: 1;
            line-height: 1.3;
        }

        /* ===== DEVICE ROTATION / LANDSCAPE FIX ===== */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .offer-list {
                flex-direction: row; /* Places offers side by side when screen is short */
            }
            .offer-btn {
                flex: 1;
                padding: 10px;
            }
            .locker-preview-box {
                padding: 10px;
                margin-bottom: 15px;
            }
            .preview-img {
                width: 45px;
                height: 45px;
            }
            .offer-instructions {
                margin-bottom: 15px;
            }
        }

        /* ===== RESTORED ROTATING FOLDING CUBE ===== */
        .folding-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .folding {
            margin: 20px auto;
            width: 60px;
            height: 60px;
            position: relative;
            transform: rotateZ(45deg);
        }

        .folding .sk-cube {
            float: left;
            width: 50%;
            height: 50%;
            position: relative;
            transform: scale(1.1);
        }

        .folding .sk-cube::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ffffff, var(--primary-accent));
            animation: sk-foldCubeAngle 2.4s infinite linear both;
            transform-origin: 100% 100%;
        }

        .folding .sk-cube2 { transform: scale(1.1) rotateZ(90deg); }
        .folding .sk-cube3 { transform: scale(1.1) rotateZ(180deg); }
        .folding .sk-cube4 { transform: scale(1.1) rotateZ(270deg); }
        .folding .sk-cube2::before { animation-delay: 0.3s; }
        .folding .sk-cube3::before { animation-delay: 0.6s; }
        .folding .sk-cube4::before { animation-delay: 0.9s; }

        /* ===== ANIMATIONS ===== */
        @keyframes sk-foldCubeAngle {
            0%, 10% { transform: perspective(140px) rotateX(-180deg); opacity: 0; }
            25%, 75% { transform: perspective(140px) rotateX(0deg); opacity: 1; }
            90%, 100% { transform: perspective(140px) rotateY(180deg); opacity: 0; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://i.postimg.cc/TP3yfNPR/Spooky_block.webp" alt="Logo">
            <div class="title">Steal a Brainrot</div>
            <div class="active-users">
                <i class="fa-solid fa-users"></i> Active users: <span id="activeUsersCount">142</span>
            </div>
            <div class="subtitle">Select up to 3 items you wish to generate</div>
        </div>

        <div id="error-msg" class="error-msg">You can only select up to 3 items.</div>

        <div class="items-grid" id="itemsGrid">
            <!-- Items injected here by JS -->
        </div>

        <button id="continue-btn" class="btn-primary">Claim Items</button>
    </div>

    <!-- USERNAME POPUP -->
    <div id="username-modal" class="overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="UI.closeModals()"><i class="fa-solid fa-times"></i></button>
            <div class="modal-scroll-area" id="username-content">
                <h3 style="margin-bottom: 15px;">Target Account</h3>
                <div id="modal-preview" class="preview-container"></div>
                <p style="font-size: 0.95rem; color: var(--text-muted);">Enter the username to send these items to.</p>
                
                <input type="text" id="username-input" class="input-field" placeholder="Enter Username..." autocomplete="off" autocorrect="off" spellcheck="false">
                <div id="user-error" class="error-msg" style="display: none;">Please enter a valid username.</div>
                
                <div class="modal-buttons">
                    <button class="btn-secondary" onclick="UI.closeModals()">Cancel</button>
                    <button class="btn-action" onclick="App.verifyUser()">Verify</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UPGRADED LOCKER MODAL -->
    <div id="locker-modal" class="overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="UI.closeModals()"><i class="fa-solid fa-times"></i></button>
            <div class="modal-scroll-area" id="locker-content">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="dingSound" preload="auto" src="https://cdn.pixabay.com/audio/2022/03/10/audio_63c49c13c8.mp3"></audio>

    <script>
        const CONFIG = {
            API_KEY: "3b17a09c1ca2bba2d52ffadab4894374",
            USER_ID: "504359",
            API_URL: "https://d1y3y09sav47f5.cloudfront.net/public/offers/feed.php",
            MAX_SELECTIONS: 3
        };

        const ITEMS = [
            { name: "Strawberry Elephant (GOLD)", img: "https://i.postimg.cc/gk73hH5D/Elephant2-v2.webp" },
            { name: "Dragon Gingerini", img: "https://i.postimg.cc/nVK8yVxx/Dragon-Gingerini.webp" },
            { name: "Chicleteira Champeona", img: "https://i.postimg.cc/fbP7tdGF/Chicleteira-Champeona.webp" },
            { name: "Dragon cannelloni", img: "https://static.wikia.nocookie.net/stealabr/images/3/31/Nah_uh.png" },
            { name: "Griffin", img: "https://i.postimg.cc/dVdrQ572/Griffin.webp" },
            { name: "Tung Tung Tung Sahur", img: "https://i.postimg.cc/MKm6Xxz3/Tung-Tung-Sahur.webp" },
            { name: "Strawberry Elephant", img: "https://static.wikia.nocookie.net/stealabr/images/5/58/Strawberryelephant.png" },
            { name: "Hydra Dragon", img: "https://i.postimg.cc/J7kkF8yK/Hydra-Dragon-Cannelloni.webp" },
            { name: "Garama and Madundung", img: "https://i.postimg.cc/L6dggKYd/Garamadundung.webp" },
            { name: "Fragrama and Chocrama", img: "https://i.postimg.cc/BvHkdnt0/Fragrama.webp" },
            { name: "Tung Tung sahur", img: "https://static.wikia.nocookie.net/stealabr/images/e/e3/Tung_Tung_Tung_Sahur.png" },
            { name: "La vacca saturno", img: "https://static.wikia.nocookie.net/stealabr/images/5/5f/Candy_La_Vacca_Saturno_Saturnita.png" },
            { name: "Cooki and Milki", img: "https://i.postimg.cc/zGxT0Qqq/Cooki-and-milki.webp" },
            { name: "La Cucaracha", img: "https://static.wikia.nocookie.net/stealabr/images/4/46/La_Cucaracha.png" },
            { name: "La Bros", img: "https://static.wikia.nocookie.net/stealabr/images/5/53/BROOOOOOOO.png" }
        ];

        const State = {
            selectedItems: []
        };

        const UI = {
            init() {
                const grid = document.getElementById('itemsGrid');
                ITEMS.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.dataset.id = index;
                    card.innerHTML = `
                        <img src="${item.img}" class="item-img" alt="${item.name}">
                        <div class="item-name">${item.name}</div>
                    `;
                    card.addEventListener('click', () => App.toggleSelection(card, item));
                    grid.appendChild(card);
                });

                document.getElementById('continue-btn').addEventListener('click', App.showUsernameModal);
                setInterval(() => {
                    document.getElementById('activeUsersCount').textContent = Math.floor(Math.random() * 800) + 100;
                }, 4500);
            },
            
            showError(elementId) {
                const el = document.getElementById(elementId);
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 3000);
            },

            closeModals() {
                document.querySelectorAll('.overlay').forEach(m => m.style.display = 'none');
                document.body.classList.remove('no-scroll');
            }
        };

        const App = {
            toggleSelection(cardElement, itemData) {
                const index = State.selectedItems.findIndex(i => i.name === itemData.name);
                
                if (index > -1) {
                    State.selectedItems.splice(index, 1);
                    cardElement.classList.remove('selected');
                } else {
                    if (State.selectedItems.length >= CONFIG.MAX_SELECTIONS) {
                        UI.showError('error-msg');
                        return;
                    }
                    State.selectedItems.push(itemData);
                    cardElement.classList.add('selected');
                    const audio = document.getElementById('dingSound');
                    audio.currentTime = 0;
                    audio.play().catch(()=>{});
                }

                const btn = document.getElementById('continue-btn');
                if (State.selectedItems.length > 0) btn.classList.add('show');
                else btn.classList.remove('show');
            },

            showUsernameModal() {
                // Save original content format to revert back if they cancel
                if(!State.originalUsernameHTML) {
                    State.originalUsernameHTML = document.getElementById('username-content').innerHTML;
                } else {
                    document.getElementById('username-content').innerHTML = State.originalUsernameHTML;
                }

                const preview = document.getElementById('modal-preview');
                if(preview) {
                    preview.innerHTML = State.selectedItems.map(item => `<img src="${item.img}" class="preview-img">`).join('');
                }
                
                document.getElementById('username-modal').style.display = 'flex';
                document.body.classList.add('no-scroll');
                
                setTimeout(() => {
                    const input = document.getElementById('username-input');
                    if(input) input.focus();
                }, 100);
            },

            verifyUser() {
                const username = document.getElementById('username-input').value.trim();
                if (username.length < 3) {
                    UI.showError('user-error');
                    return;
                }
                
                const box = document.getElementById('username-content');
                // Replaces content with the restored rotating folding cube
                box.innerHTML = `
                    <h3 style="margin-bottom: 20px;">Searching...</h3>
                    <div class="folding-wrapper">
                        <div class="folding">
                            <div class="sk-cube1 sk-cube"></div>
                            <div class="sk-cube2 sk-cube"></div>
                            <div class="sk-cube4 sk-cube"></div>
                            <div class="sk-cube3 sk-cube"></div>
                        </div>
                    </div>
                    <p style="color: var(--text-muted); margin-top: 10px;">Looking up @${username}</p>
                `;

                setTimeout(() => {
                    document.getElementById('username-modal').style.display = 'none';
                    this.openLocker(username);
                }, 2400);
            },

            openLocker(username) {
                const lockerContent = document.getElementById('locker-content');
                
                const selectedItemsHTML = State.selectedItems.map(item => 
                    `<img src="${item.img}" class="preview-img" alt="${item.name}" title="${item.name}">`
                ).join('');

                lockerContent.innerHTML = `
                    <div class="locker-header">
                        <h3 style="margin-bottom: 5px;">Final Step for <br><span style="color: var(--primary-accent)">@${username}</span></h3>
                        <div class="secure-badge"><i class="fa-solid fa-shield-check"></i> Bot Protection Active</div>
                    </div>

                    <div class="locker-preview-box">
                        ${selectedItemsHTML}
                    </div>

                    <div class="verification-status">
                        <i class="fa-solid fa-circle-exclamation"></i> Human Verification Required
                    </div>

                    <p class="offer-instructions">Please complete <b>one</b> of the quick tasks below to verify you are human. Your selected items will unlock instantly upon completion.</p>
                    
                    <div id="offers-list" class="offer-list">
                        <div class="folding-wrapper" style="min-height:60px;">
                            <div class="folding" style="transform: scale(0.6) rotateZ(45deg); margin:0;">
                                <div class="sk-cube1 sk-cube"></div>
                                <div class="sk-cube2 sk-cube"></div>
                                <div class="sk-cube4 sk-cube"></div>
                                <div class="sk-cube3 sk-cube"></div>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('locker-modal').style.display = 'flex';
                this.fetchOffers();
            },

            fetchOffers() {
                const url = `${CONFIG.API_URL}?user_id=${CONFIG.USER_ID}&api_key=${CONFIG.API_KEY}&s1=steal%20a%20brainrot`;
                
                fetch(url)
                    .then(res => res.json())
                    .then(offers => {
                        if (!Array.isArray(offers) || offers.length === 0) throw new Error("No offers");
                        this.renderOffers(offers.slice(0, 2));
                    })
                    .catch(() => {
                        this.renderOffers([
                            { name: "Complete Quick Survey", url: "#", network_icon: "https://via.placeholder.com/40" },
                            { name: "Download & Open App", url: "#", network_icon: "https://via.placeholder.com/40" }
                        ]);
                    });
            },

            renderOffers(offers) {
                const list = document.getElementById('offers-list');
                list.innerHTML = '';
                
                offers.forEach(offer => {
                    const btn = document.createElement('div');
                    btn.className = 'offer-btn';
                    const title = offer.anchor || offer.name || "Complete Offer";
                    const url = offer.url + `&sub2=u${CONFIG.USER_ID}&sub15=stealabrainrot`;
                    
                    btn.innerHTML = `
                        <img src="${offer.network_icon}" class="offer-icon" onerror="this.src='https://via.placeholder.com/40'">
                        <span class="offer-text">${title}</span>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-muted)"></i>
                    `;
                    
                    btn.onclick = () => window.open(url, '_blank');
                    list.appendChild(btn);
                });
            }
        };

        document.addEventListener('DOMContentLoaded', UI.init);
    </script>
</body>
</html>
